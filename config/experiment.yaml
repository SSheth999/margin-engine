# Experiment config for the E2B + Terminal-Bench 2 matrix.

terminal_bench:
  # Local clone of harbor-framework/terminal-bench-2-1 tasks. Populate with
  # scripts/fetch_terminal_bench.sh (does a sparse checkout of tasks/).
  tasks_root: tasks/terminal_bench/tasks

  # Optional allow-list of task_ids to run. Empty/omitted = all discovered tasks.
  # Start small to control cost/time, then scale toward the full ~89.
  # Full benchmark: all discovered tasks (empty include = no filter).
  include_tasks: []

  # Optional cap on number of tasks (applied after include filtering).
  limit: null

  # Skip tasks that request GPUs (gpus > 0). Set false only if your E2B instance
  # provides GPU sandboxes.
  skip_gpu_tasks: true

# Contracted price + target margin synthesized per TB2 difficulty bucket.
# ceiling = price * (1 - margin).
# Calibrated to the gpt-5.6-terra cost regime observed on an Arm-A pass so that easy
# tasks stay under ceiling (no false-positive interventions) while pricier tasks blow
# and exercise the arms. ceiling = price * (1 - margin).
#   easy   0.20 * 0.30 = 0.060   medium 0.35 * 0.30 = 0.105   hard 0.40 * 0.30 = 0.120
price_by_class:
  easy: 0.20
  medium: 0.35
  hard: 0.40
margin_by_class:
  easy: 0.70
  medium: 0.70
  hard: 0.70

# E2B connection is read from env by the SDK: E2B_API_KEY (required),
# E2B_DOMAIN (for a self-hosted E2B instance). Each Harbor image is built into an E2B
# template once; the image -> alias map is cached in config/e2b_templates.json.

# Sandbox price for the infrastructure-cost estimate in analysis.report. Model spend is
# only part of the bill: sandboxes are billed by the second, so an intervention that cuts
# tokens but raises step count can be a net loss. Set this to your E2B rate (USD per
# sandbox-hour) to see model vs infra split per arm; leave null to report hours only.
# Run logs must carry `sandbox_sec` (recorded from the 2026-08 sweep onward).
e2b_usd_per_sandbox_hour: null
