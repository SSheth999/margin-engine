# Which backend the gateway talks to. Swapping providers is a one-line change here,
# never a code change — same "single switch" principle as the arm selector.
active_provider: ollama   # mock | ollama | anthropic

providers:
  ollama:
    # OpenAI-compatible endpoint exposed by a local Ollama daemon.
    base_url: http://localhost:11434/v1
    # primary = the model the agent runs on; cheap = the downshift sibling.
    # Pick tags that are actually pulled locally (`ollama pull ...`).
    model_pair:
      primary: qwen3.5:9b
      cheap: qwen3.5:4b   # downshift target — change to your pulled smaller tag

  anthropic:
    # Native anthropic SDK reads the key from the ANTHROPIC_API_KEY env var.
    model_pair:
      primary: claude-sonnet-5
      cheap: claude-haiku-4-5-20251001

  mock:
    # Deterministic test double (no inference, no network). Used to validate the
    # rig end-to-end before Ollama/Anthropic are available. See providers/mock_provider.py.
    model_pair:
      primary: mock-large
      cheap: mock-small
