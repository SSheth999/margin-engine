# Per-model pricing, expressed in USD per 1,000,000 tokens.
# cost.py converts to per-token internally.
#
# Ollama rates are SYNTHETIC — local inference is free, but we apply a made-up
# rate card to the real token counts so the margin-ceiling mechanics get exercised
# at zero real spend. They mirror the Anthropic rates so dev behavior tracks prod.
#
# Anthropic rates are the real published prices (verify before a real-money run).
#
# cache_read_multiplier: fraction of the input rate charged for cached input tokens.

ollama:
  # Model names MUST match config/providers.yaml exactly, or cost logs $0.
  # primary (4b) is priced higher than the cheap sibling so downshift saves cost.
  qwen3.5:4b:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    cache_read_multiplier: 0.10
  qwen3:1.7b:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    cache_read_multiplier: 0.10

openai:
  # USD per 1M tokens. cache_read_multiplier 0.25 = OpenAI's ~75%-off cached input.
  # gpt-5.x figures are approximate (exact public pricing unverified) but preserve the
  # primary >> downshift ordering the experiment relies on.
  gpt-5.6-terra:
    input_per_mtok: 2.50
    output_per_mtok: 10.00
    cache_read_multiplier: 0.25
  gpt-5-mini:
    input_per_mtok: 0.25
    output_per_mtok: 2.00
    cache_read_multiplier: 0.25
  gpt-4.1:
    input_per_mtok: 2.00
    output_per_mtok: 8.00
    cache_read_multiplier: 0.25
  gpt-4.1-mini:
    input_per_mtok: 0.40
    output_per_mtok: 1.60
    cache_read_multiplier: 0.25

anthropic:
  claude-sonnet-5:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    cache_read_multiplier: 0.10
  claude-haiku-4-5-20251001:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    cache_read_multiplier: 0.10

# Synthetic rates for the mock test double. Deliberately high so multi-step tasks
# generate visible costs against the margin ceilings during rig validation.
mock:
  mock-large:
    input_per_mtok: 40.00
    output_per_mtok: 200.00
    cache_read_multiplier: 0.10
  mock-small:
    input_per_mtok: 12.00
    output_per_mtok: 60.00
    cache_read_multiplier: 0.10
