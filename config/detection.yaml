# Heuristic failure-mode detection + intervention thresholds. Deterministic and
# logged — the novelty being tested is the MATCHING, not detector sophistication.

# Interventions are only considered once the run is trending over budget. Gating on
# cost_ratio here is also what keeps interventions OFF easy tasks (they never reach
# this ratio), satisfying the "do NOT intervene on easy tasks" hard rule.
trigger_cost_ratio: 0.60

# Tool loop: the most-repeated (tool_name, args_hash) pair occurs >= this many times.
tool_loop_repeats: 3

# Context blowout: context size grew by more than this ratio over the lookback window.
context_growth_ratio: 1.50
context_growth_lookback: 3

# Wrong model: high cost but context roughly flat -> growth under this ratio counts as flat.
context_flat_ratio: 1.15

# Inherent difficulty: cost ratio already this high within the first `early_steps` steps,
# with no loop/blowout waste signal -> the task is just expensive; block/escalate.
inherent_difficulty_ratio: 0.90
early_steps: 4

# Compaction keeps system messages + the first (task) turn + this many recent turns.
compact_keep_recent_turns: 3

# ---------------------------------------------------------------------------------
# Arm D — laddered budget policy. Not a failure-mode-matched arm: a graduated
# escalation on the cost ratio alone, built from what the first full benchmark showed
# actually works.
#
#   >= d_downshift_ratio : downshift to the cheap sibling (the single most effective
#                          lever measured: margin-blown 41.4% -> 2.3% in Arm B).
#   >= d_compact_ratio   : additionally compact ONCE, and only if the trim is large
#                          enough to beat the prompt-cache invalidation it causes
#                          (see interventions.compaction_gain).
#   >= d_stop_ratio      : hard stop. Overrunning the ceiling almost never buys the
#                          outcome — Arm A resolved 8% of blown runs vs 45% of held
#                          runs — so stopping at the ceiling caps P99 by construction
#                          and gives up little quality.
d_downshift_ratio: 0.60
d_compact_ratio: 0.85
d_stop_ratio: 1.00

# Stop on the PROJECTED cost (cum + trailing-mean per-call cost) rather than on money
# already spent. A spent-only check waves a run through at ratio 0.99 and overshoots by
# a whole call; projecting forward is what makes the ceiling actually hold.
d_stop_lookahead: true

# Compact aggressively when compacting at all (keep fewer recent turns than arm C's 3),
# at most this many times per run, and only when it drops at least this fraction of the
# prompt. min_drop_fraction 0.60 => dropped/surviving = 1.5, so the break-even is ~2
# further calls at a 0.25 cache multiplier.
d_compact_keep_recent_turns: 2
d_compact_max_per_run: 1
d_compact_min_drop_fraction: 0.60

# Skip compaction entirely when this much of the last prompt was served from cache —
# there the prefix is already cheap and invalidating it costs more than it saves.
d_compact_max_cache_share: 0.85
